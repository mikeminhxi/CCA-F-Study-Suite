# .github/workflows/sync-language-config.yml
# Regenerates languages.config.js from the CCAF_LANG_CONFIG repo Variable
# (Settings -> Secrets and variables -> Actions -> Variables), so a maintainer
# can toggle a language's visibility there instead of hand-editing the JS file.
# Manually triggered: run it after changing the Variable's value.
name: Sync language config

on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CCAF_LANG_CONFIG: ${{ vars.CCAF_LANG_CONFIG }}
      BRANCH: chore/sync-language-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests
        run: node --test .github/scripts/sync-language-config.test.js
      - name: Sync languages.config.js from CCAF_LANG_CONFIG
        id: sync
        run: node .github/scripts/sync-language-config.js
      - name: Open or update PR
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add languages.config.js
          git commit -m "chore: sync languages.config.js from CCAF_LANG_CONFIG variable"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR already open for $BRANCH, updated its branch."
          else
            gh pr create --title "chore: sync languages.config.js from CCAF_LANG_CONFIG variable" \
              --body "Auto-generated by the *Sync language config* workflow from the \`CCAF_LANG_CONFIG\` repo Variable. Review the diff, then merge (validated by the existing *Validate language config* check)." \
              --head "$BRANCH" --base main
            gh pr edit "$BRANCH" --add-assignee mikeminhxi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
